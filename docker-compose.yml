version: "3.4"

services:
  web:
    image: "gartenkalender"
    build:
      context: .
      target: build
      args:
        RAILS_ENV: "development"
    environment:
      - RAILS_ENV=development
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/gartenkalender_development
    command: bash -c "rm -f tmp/pids/server.pid && bundle exec rails s -p 3000 -b '0.0.0.0'"
    volumes:
      - .:/gartenkalender:delegated
    ports:
      - "3000:3000"
    depends_on:
      - postgres

  postgres:
    image: postgres:13-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=gartenkalender_development
    volumes:
      - ./tmp/db:/var/lib/postgresql/data:delegated
    ports:
      - "5432:5432"
